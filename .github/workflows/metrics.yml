name: Metrics (StarLists & Topics)

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # ⭐ Repositories from star lists
      - name: Star lists repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          filename: metrics/metrics.plugin.starlists.svg

      # 📊 Languages from star lists
      - name: Star lists languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes
          filename: metrics/metrics.plugin.starlists.languages.svg

      # 🏷 Starred topics (with icons)
      - name: Starred topics icons
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_topics: yes
          plugin_topics_mode: icons
          filename: metrics/metrics.plugin.topics.icons.svg
