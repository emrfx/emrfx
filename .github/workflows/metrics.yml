name: Metrics (Stargazers)

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Stargazers grafik (Ücretsiz)
      - name: Generate Stargazers Chart
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: emrfx
          template: classic
          base: ""
          config_timezone: Europe/Istanbul

          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          filename: metrics/metrics.plugin.stargazers.svg

      # 2) Star lists + Languages (Ücretsiz)
      - name: Generate Star Lists + Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: emrfx
          template: classic
          base: ""
          config_timezone: Europe/Istanbul

          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists_limit: 7
          plugin_starlists_limit_repositories: 3
          plugin_starlists_limit_languages: 8
          filename: metrics/metrics.plugin.starlists.languages.svg

      # 3) Starred topics (Icons) (Ücretsiz)
      - name: Generate Starred Topics (Icons)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: emrfx
          template: classic
          base: ""
          config_timezone: Europe/Istanbul

          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 0
          filename: metrics/metrics.plugin.topics.icons.svg
