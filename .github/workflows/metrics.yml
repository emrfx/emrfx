name: Metrics (Stargazers + Topics + StarLists)

on:
  schedule:
    - cron: "0 0 * * *"   # her gün 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Full Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          template: classic
          config_timezone: Europe/Istanbul

          # ⭐ STARGAZERS
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          plugin_stargazers_worldmap: yes

          # ⭐ STAR LISTS (repo + dil istatistiği)
          plugin_starlists: yes
          plugin_starlists_languages: yes

          # 🏷️ TOPICS (ikonlu)
          plugin_topics: yes
          plugin_topics_mode: icons

          # 📁 çıktı dosyası
          filename: metrics/metrics.all.svg

