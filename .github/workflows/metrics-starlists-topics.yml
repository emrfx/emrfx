name: Metrics (StarLists Split)

on:
  schedule:
    - cron: "0 0 * * *" # her gün 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Repositories from Star Lists (sadece repo listesi)
      - name: Star lists (repositories)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: no
          filename: metrics/metrics.plugin.starlists.repos.svg

      # 2) Languages from Star Lists (sadece diller)
      - name: Star lists (languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists: no
          filename: metrics/metrics.plugin.starlists.languages.svg


