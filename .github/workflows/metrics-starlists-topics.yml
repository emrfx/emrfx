name: Metrics (StarLists & Topics)

on:
  schedule:
    - cron: "0 0 * * *" # her gün 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) StarLists (repos listesi)
      - name: Star lists (repos)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          filename: metrics/metrics.plugin.starlists.svg

      # 2) StarLists (languages)
      - name: Star lists (languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: emrfx
          base: ""
          plugin_starlists: yes
          plugin_starlists_languages: yes
          filename: metrics/metrics.plugin.starlists.languages.svg

